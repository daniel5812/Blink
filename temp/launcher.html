<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blink Detection</title>
  <style>
    :root { --bg:#0b1020; --fg:#e9eefc; --muted:#9fb0d9; --card:#121a33; --accent:#9ad0ff }
    * { box-sizing:border-box }
    body { 
      margin:0; 
      width:50px; 
      max-width:50px; 
      height:30px;
      max-height:30px;
      background:var(--bg); 
      color:var(--fg); 
      font:14px system-ui;
      opacity: 0.8;
      position: fixed;
      top: 0;
      right: 0;
      z-index: 9999;
      overflow: hidden;
    }
    header, #video-wrap, #stats, #blink-counter, #open { display: none; }
    #video, #overlay { position:absolute; inset:0; width:100%; height:100%; }
    #video { transform: scaleX(-1); } /* Mirror the video */
    
    /* Small indicator for launcher */
    body::after {
      content: "B";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--accent);
      font-weight: bold;
      font-size: 16px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Blink Detection</h1>
  </header>

  <section id="video-wrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </section>

  <div id="stats" style="padding:8px 10px;font:13px system-ui;color:#e9eefc">
    <div class="row"><span>Yaw</span>   <div class="bar"><div id="bar-yaw"></div></div><span id="yaw">0°</span></div>
    <div class="row"><span>Pitch</span> <div class="bar"><div id="bar-pitch"></div></div><span id="pitch">0°</span></div>
    <div class="row"><span>Roll</span>  <div class="bar"><div id="bar-roll"></div></div><span id="roll">0°</span></div>
    <div class="row"><span>EAR</span>   <div class="bar"><div id="bar-ear"></div></div><span id="ear">-</span></div>
    <div class="row"><span>MAR</span>   <div class="bar"><div id="bar-mar"></div></div><span id="mar">-</span></div>
  </div>

  <div id="blink-counter" style="padding:8px 10px;font:13px system-ui;color:#e9eefc;background:var(--card);margin:8px;border-radius:12px;text-align:center;">
    <div style="font-size:18px;font-weight:bold;color:var(--accent);">Blinks: <span id="blink-count">0</span></div>
    <div style="font-size:16px;font-weight:bold;color:#ff6b6b;margin-top:4px;">Double Blinks: <span id="double-blink-count">0</span></div>
    <div style="font-size:14px;margin-top:4px;color:var(--muted);">Eye Distance: <span id="eye-distance">-</span> px</div>
    <div style="font-size:14px;margin-top:4px;color:var(--accent);">1/Eyes: <span id="eye-inverse">-</span></div>
    <div style="font-size:14px;margin-top:4px;color:var(--accent);">Distance: <span id="camera-distance">-</span> cm</div>
  </div>

  <button id="open">Open Floating Window</button>

  <script type="module" src="launcher.js"></script>
</body>
</html>
