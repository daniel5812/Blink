<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blink Mobile MVP</title>
</head>
<body>

<h2>Blink – Mobile MVP</h2>

<input id="url" placeholder="הדבק URL של אתר" style="width:100%;padding:12px" />
<button onclick="go()" style="margin-top:10px;padding:12px;width:100%">
  Open site
</button>

<p style="margin-top:20px;font-size:14px">
  אחרי שהאתר נפתח – לחץ על הכפתור:
</p>

<a id="bookmarklet"
   style="display:inline-block;padding:10px 14px;background:#000;color:#fff;border-radius:8px;text-decoration:none">
  Enable Blink
</a>

<script>
const BASE = "http://10.0.0.5:8000/mobile";

function go() {
  const url = document.getElementById("url").value.trim();
  if (!url) return;
  window.location.href = url;
}

// Bookmarklet loader
document.getElementById("bookmarklet").href =
  "javascript:(function(){var s=document.createElement('script');" +
  "s.src='" + BASE + "/inject.js?'+Date.now();" +
  "document.body.appendChild(s);})();";
</script>

</body>
</html>
